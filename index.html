<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- SEO Metadata -->
  <title>Mayura Designs | Timeless Sarees, Beautifully Woven | Kerala Luxury Sarees</title>
  <meta name="description" content="Discover handpicked Kerala sarees, Kasavu tissue sarees, royal Kanchipuram silk, and handloom cottons from Mayura Designs (@mayura.designss). Fast delivery across Kerala." />
  <meta name="keywords" content="Kerala sarees, Kasavu sarees, Designer sarees Kerala, Cotton sarees Kerala, Silk sarees Kerala, Affordable sarees Kerala, Mayura Designs" />
  
  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Mayura Designs | Timeless Sarees, Beautifully Woven" />
  <meta property="og:description" content="Premium Kerala saree fashion boutique featuring Kasavu, Silk, Cotton, and Designer sarees." />
  <meta property="og:image" content="./assets/images/hero.jpg" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            midnight: '#0A1128',
            navy: '#0F172A',
            gold: '#C5A059',
            cream: '#FAF8F5',
            charcoal: '#1E293B'
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="./assets/css/styles.css" />

  <!-- React 18 & ReactDOM UMD -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Babel Standalone for inline JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Store Service and Demo Data -->
  <script src="./js/bundle.js"></script>
</head>
<body class="bg-[#FAF8F5] text-[#1E293B]">
  <div id="root"></div>

  <!-- App Component Script -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    var store = window.mayuraStore || window.store;

    function App() {
      // App Navigation & Modal States
      const [currentView, setCurrentView] = useState('home'); // 'home', 'shop', 'product-detail', 'cart', 'about', 'collections', 'contact', 'policy', 'admin'
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [activeFilter, setActiveFilter] = useState('all'); // 'under-999', 'under-1499', 'new', 'bestseller', 'sale'
      const [searchQuery, setSearchQuery] = useState('');
      const [sortBy, setSortBy] = useState('featured');
      const [selectedProductId, setSelectedProductId] = useState(null);
      
      // Modals & Drawers
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [isSearchOpen, setIsSearchOpen] = useState(false);
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
      const [isQuickViewOpen, setIsQuickViewOpen] = useState(false);
      const [quickViewProduct, setQuickViewProduct] = useState(null);
      
      // Data state
      const [products, setProducts] = useState(store.getProducts());
      const [cart, setCart] = useState(store.getCart());
      const [lang, setLang] = useState(store.getLang());
      const [categories, setCategories] = useState(store.getCategories());
      const [districts, setDistricts] = useState(store.getDistricts());
      const [homepageContent, setHomepageContent] = useState(store.getHomepageContent());
      const [reviews, setReviews] = useState(store.getReviews());
      const [instagramPosts, setInstagramPosts] = useState(store.getInstagramPosts());

      // Admin Auth & Portal State
      const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
      const [adminPasscode, setAdminPasscode] = useState('');
      const [adminTab, setAdminTab] = useState('products'); // 'products', 'categories', 'delivery', 'homepage', 'reviews', 'instagram'
      const [adminSearch, setAdminSearch] = useState('');
      const [adminProductModalOpen, setAdminProductModalOpen] = useState(false);
      const [editingProduct, setEditingProduct] = useState(null);
      const [adminProductForm, setAdminProductForm] = useState({
        code: '', name: '', nameMl: '', category: 'Kasavu', mrp: 2499, price: 1799, discount: 28, stock: 10,
        fabric: 'Pure Kerala Handloom', length: '6.3 Meters with Blouse Piece', care: 'Dry Clean Only', description: 'Authentic handcrafted Kerala saree draped in luxury.',
        image: './assets/images/kasavu_1.jpg', images: ['./assets/images/kasavu_1.jpg'],
        isNew: true, isBestSeller: false, isSale: false, isFeatured: true
      });

      // Admin Management Auxiliary Forms
      const [newCategoryInput, setNewCategoryInput] = useState('');
      const [homepageForm, setHomepageForm] = useState(store.getHomepageContent());
      const [newReviewForm, setNewReviewForm] = useState({ name: '', location: 'Kerala', rating: 5, comment: '', saree: '' });
      const [newIgForm, setNewIgForm] = useState({ image: './assets/images/kasavu_1.jpg', caption: '' });

      // Guest Order Details Form for WhatsApp Checkout
      const [customerForm, setCustomerForm] = useState({
        name: '', phone: '', house: '', locality: '', district: 'Ernakulam (Kochi)', pincode: '682036', notes: ''
      });

      // Direct Single Product WhatsApp Modal
      const [directWhatsAppProduct, setDirectWhatsAppProduct] = useState(null);

      // Subscribe to store updates
      useEffect(() => {
        const unsubscribe = store.subscribe(() => {
          setProducts(store.getProducts());
          setCart(store.getCart());
          setLang(store.getLang());
          setCategories(store.getCategories());
          setDistricts(store.getDistricts());
          const hp = store.getHomepageContent();
          setHomepageContent(hp);
          setHomepageForm(hp);
          setReviews(store.getReviews());
          setInstagramPosts(store.getInstagramPosts());
        });
        return unsubscribe;
      }, []);

      // Filtered Products Logic
      const filteredProducts = useMemo(() => {
        return products.filter(product => {
          if (selectedCategory !== 'all') {
            const catMatch = product.category.toLowerCase().replace(/\s+/g, '-') === selectedCategory.toLowerCase();
            if (!catMatch && selectedCategory !== product.category.toLowerCase()) return false;
          }
          
          if (activeFilter === 'under-999' && product.price >= 999) return false;
          if (activeFilter === 'under-1499' && product.price >= 1499) return false;
          if (activeFilter === 'new' && !(product.isNewArrival || product.isNew)) return false;
          if (activeFilter === 'bestseller' && !product.isBestSeller) return false;
          if (activeFilter === 'sale' && !product.isSale) return false;

          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const nameMatch = product.name.toLowerCase().includes(q) || (product.nameMl && product.nameMl.includes(q)) || (product.code && product.code.toLowerCase().includes(q));
            const catMatch = product.category.toLowerCase().includes(q);
            const fabMatch = product.fabric && product.fabric.toLowerCase().includes(q);
            if (!nameMatch && !catMatch && !fabMatch) return false;
          }

          return true;
        }).sort((a, b) => {
          if (sortBy === 'price-low') return a.price - b.price;
          if (sortBy === 'price-high') return b.price - a.price;
          if (sortBy === 'discount') return b.discount - a.discount;
          if (sortBy === 'rating') return b.rating - a.rating;
          return 0;
        });
      }, [products, selectedCategory, activeFilter, searchQuery, sortBy]);

      // Cart Totals
      const cartTotals = useMemo(() => {
        return store.getCartTotals(customerForm.district, customerForm.pincode);
      }, [cart, customerForm.district, customerForm.pincode]);

      const cartDetailed = useMemo(() => store.getCartDetailed(), [cart, products]);

      // Handlers
      const handleOpenProduct = (id) => {
        setSelectedProductId(id);
        setCurrentView('product-detail');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleAddToCart = (productId, qty = 1, openCart = true) => {
        store.addToCart(productId, qty);
        if (openCart) setIsCartOpen(true);
      };

      const handleBuyViaWhatsAppDirect = (product) => {
        setDirectWhatsAppProduct(product);
      };

      const handleSendWhatsAppCartOrder = (e) => {
        if (e) e.preventDefault();
        if (!customerForm.name || !customerForm.phone || !customerForm.house || !customerForm.locality || !customerForm.pincode) {
          alert('Please fill in your Full Name, Mobile Number, House, Locality, and PIN Code before ordering on WhatsApp.');
          return;
        }
        const url = store.buildWhatsAppUrl(cartDetailed, customerForm);
        window.open(url, '_blank');
      };

      const handleSendWhatsAppDirectOrder = (e) => {
        if (e) e.preventDefault();
        if (!customerForm.name || !customerForm.phone || !customerForm.house || !customerForm.locality || !customerForm.pincode) {
          alert('Please fill in your Full Name, Mobile Number, House, Locality, and PIN Code before ordering on WhatsApp.');
          return;
        }
        const url = store.buildWhatsAppUrl([{ product: directWhatsAppProduct, quantity: 1 }], customerForm);
        setDirectWhatsAppProduct(null);
        window.open(url, '_blank');
      };

      const getNextProductId = () => {
        let maxNum = 0;
        products.forEach(p => {
          if (p.code && p.code.toUpperCase().startsWith('MD')) {
            const num = parseInt(p.code.substring(2), 10);
            if (!isNaN(num) && num > maxNum) maxNum = num;
          }
        });
        return `MD${String(maxNum + 1).padStart(3, '0')}`;
      };

      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (adminPasscode === 'mayura2026' || adminPasscode === 'admin') {
          setIsAdminAuthenticated(true);
        } else {
          alert('Invalid Admin Passcode! Use "mayura2026"');
        }
      };

      const handleSaveAdminProduct = (e) => {
        e.preventDefault();
        
        // 1. Validation
        const rawCode = (adminProductForm.code || '').trim().toUpperCase();
        if (!rawCode) {
          alert('Product ID (e.g. MD009) is required.');
          return;
        }

        const duplicateMatch = products.find(p => p.code && p.code.toUpperCase() === rawCode && (!editingProduct || p.id !== editingProduct.id));
        if (duplicateMatch) {
          alert(`Product ID "${rawCode}" is already assigned to "${duplicateMatch.name}". Please use a unique Product ID like ${getNextProductId()}.`);
          return;
        }

        if (!adminProductForm.name || !adminProductForm.name.trim()) {
          alert('Product Name (English) is required.');
          return;
        }

        if (!adminProductForm.category) {
          alert('Please select a Category.');
          return;
        }

        const mrp = Number(adminProductForm.mrp || adminProductForm.price || 0);
        const price = Number(adminProductForm.price || 0);
        if (price < 0 || mrp < 0) {
          alert('Price and MRP must be non-negative numbers.');
          return;
        }

        const stock = Number(adminProductForm.stock ?? 10);
        if (stock < 0) {
          alert('Stock quantity cannot be negative.');
          return;
        }

        const discount = mrp > price ? Math.round(((mrp - price) / mrp) * 100) : 0;
        const mainImg = adminProductForm.image || (adminProductForm.images && adminProductForm.images[0]) || './assets/images/kasavu_1.jpg';

        const updatedForm = {
          ...adminProductForm,
          code: rawCode,
          name: adminProductForm.name.trim(),
          nameMl: (adminProductForm.nameMl || '').trim() || adminProductForm.name.trim(),
          category: adminProductForm.category,
          mrp,
          price,
          discount,
          stock,
          fabric: adminProductForm.fabric || 'Pure Kerala Handloom',
          length: adminProductForm.length || '6.3 Meters with Blouse Piece',
          care: adminProductForm.care || 'Dry Clean Only',
          description: adminProductForm.description || '',
          descriptionMl: adminProductForm.descriptionMl || adminProductForm.description || '',
          image: mainImg,
          images: [mainImg],
          isNew: Boolean(adminProductForm.isNew || adminProductForm.isNewArrival),
          isNewArrival: Boolean(adminProductForm.isNew || adminProductForm.isNewArrival),
          isBestSeller: Boolean(adminProductForm.isBestSeller),
          isSale: Boolean(adminProductForm.isSale),
          isFeatured: Boolean(adminProductForm.isFeatured)
        };

        if (editingProduct) {
          store.updateProduct({ ...editingProduct, ...updatedForm });
          alert(`Success: Product "${updatedForm.name}" (${updatedForm.code}) updated successfully!`);
        } else {
          store.addProduct(updatedForm);
          alert(`Success: New Saree "${updatedForm.name}" (${updatedForm.code}) added successfully!`);
        }

        setAdminProductModalOpen(false);
        setEditingProduct(null);
      };

      const selectedProduct = products.find(p => p.id === selectedProductId) || products[0];

      return (
        <div className="min-h-screen flex flex-col bg-[#FAF8F5] text-[#1E293B] selection:bg-[#C5A059] selection:text-white">
          
          {/* 1. ANNOUNCEMENT BAR */}
          <div className="bg-[#0A1128] text-[#F4E8C1] text-xs py-2 px-4 text-center font-medium flex justify-between items-center border-b border-[#C5A059]/30">
            <div className="hidden sm:block text-[#C5A059]">✨ MAYURA DESIGNS - Timeless Kerala Sarees</div>
            <div className="mx-auto sm:mx-0 flex items-center gap-2">
              <span>{store.t('keralaOnlyDelivery')}</span>
              <span className="text-[#C5A059]">•</span>
              <span className="hidden md:inline">WhatsApp Order: +91 95674 77246</span>
            </div>
            <div className="flex items-center gap-2 font-semibold">
              <button 
                onClick={() => store.setLang('en')} 
                className={`px-1.5 py-0.5 rounded transition ${lang === 'en' ? 'bg-[#C5A059] text-[#0A1128]' : 'hover:text-white'}`}
              >
                EN
              </button>
              <span>|</span>
              <button 
                onClick={() => store.setLang('ml')} 
                className={`px-1.5 py-0.5 rounded transition ${lang === 'ml' ? 'bg-[#C5A059] text-[#0A1128]' : 'hover:text-white'}`}
              >
                മലയാളം
              </button>
            </div>
          </div>

          {/* 2. HEADER & NAVIGATION */}
          <header className="sticky top-0 z-40 bg-[#FAF8F5]/95 backdrop-blur-md border-b border-[#C5A059]/20 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
              <button 
                onClick={() => setIsMobileMenuOpen(true)} 
                className="lg:hidden p-2 text-[#0A1128] hover:text-[#C5A059]"
                aria-label="Toggle Mobile Menu"
              >
                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
              </button>

              <div 
                onClick={() => { setCurrentView('home'); window.scrollTo({ top: 0, behavior: 'smooth' }); }} 
                className="cursor-pointer flex flex-col items-center group"
              >
                <div className="flex items-center gap-2">
                  <svg className="w-7 h-7 text-[#C5A059] transition-transform group-hover:scale-110" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2L14.5 8.5L21 9.5L16 14L17.5 20.5L12 17L6.5 20.5L8 14L3 9.5L9.5 8.5L12 2Z" />
                  </svg>
                  <span className="font-serif text-2xl sm:text-3xl font-bold tracking-tight text-[#0A1128]">
                    MAYURA <span className="text-[#C5A059] font-light">DESIGNS</span>
                  </span>
                </div>
                <span className="text-[10px] tracking-[0.25em] uppercase text-[#64748B] font-medium -mt-1">
                  {store.t('tagline')}
                </span>
              </div>

              <nav className="hidden lg:flex items-center space-x-8 text-sm font-medium">
                <button onClick={() => { setCurrentView('home'); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className={`hover:text-[#C5A059] transition ${currentView === 'home' ? 'text-[#C5A059] font-semibold border-b-2 border-[#C5A059] pb-1' : 'text-[#0A1128]'}`}>{store.t('navHome')}</button>
                <button onClick={() => { setSelectedCategory('all'); setActiveFilter('all'); setCurrentView('shop'); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className={`hover:text-[#C5A059] transition ${currentView === 'shop' && selectedCategory === 'all' && activeFilter === 'all' ? 'text-[#C5A059] font-semibold border-b-2 border-[#C5A059] pb-1' : 'text-[#0A1128]'}`}>{store.t('navShop')}</button>
                <button onClick={() => { setCurrentView('collections'); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className={`hover:text-[#C5A059] transition ${currentView === 'collections' ? 'text-[#C5A059] font-semibold border-b-2 border-[#C5A059] pb-1' : 'text-[#0A1128]'}`}>{store.t('navCollections')}</button>
                <button onClick={() => { setSelectedCategory('all'); setActiveFilter('new'); setCurrentView('shop'); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className={`hover:text-[#C5A059] transition ${activeFilter === 'new' ? 'text-[#C5A059] font-semibold border-b-2 border-[#C5A059] pb-1' : 'text-[#0A1128]'}`}>{store.t('navNewArrivals')}</button>
                <button onClick={() => { setSelectedCategory('all'); setActiveFilter('bestseller'); setCurrentView('shop'); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className={`hover:text-[#C5A059] transition ${activeFilter === 'bestseller' ? 'text-[#C5A059] font-semibold border-b-2 border-[#C5A059] pb-1' : 'text-[#0A1128]'}`}>{store.t('navBestSellers')}</button>
                <button onClick={() => { setCurrentView('about'); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className={`hover:text-[#C5A059] transition ${currentView === 'about' ? 'text-[#C5A059] font-semibold border-b-2 border-[#C5A059] pb-1' : 'text-[#0A1128]'}`}>{store.t('navAbout')}</button>
                <button onClick={() => { setCurrentView('contact'); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className={`hover:text-[#C5A059] transition ${currentView === 'contact' ? 'text-[#C5A059] font-semibold border-b-2 border-[#C5A059] pb-1' : 'text-[#0A1128]'}`}>{store.t('navContact')}</button>
              </nav>

              <div className="flex items-center space-x-4">
                <button onClick={() => setIsSearchOpen(true)} className="p-2 text-[#0A1128] hover:text-[#C5A059] transition" title="Search Sarees">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                  </svg>
                </button>

                <button onClick={() => setIsCartOpen(true)} className="p-2 bg-[#0A1128] text-white hover:bg-[#C5A059] transition rounded-full relative" title="Shopping Cart">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                  </svg>
                  {cartTotals.itemCount > 0 && (
                    <span className="absolute -top-1 -right-1 bg-[#C5A059] text-[#0A1128] text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-white">
                      {cartTotals.itemCount}
                    </span>
                  )}
                </button>
              </div>
            </div>
          </header>

          {/* MOBILE DRAWER NAVIGATION */}
          {isMobileMenuOpen && (
            <div className="fixed inset-0 z-50 flex">
              <div className="fixed inset-0 bg-black/60 backdrop-blur-sm" onClick={() => setIsMobileMenuOpen(false)}></div>
              <div className="relative bg-[#0A1128] text-white w-4/5 max-w-sm p-6 flex flex-col justify-between shadow-2xl">
                <div>
                  <div className="flex items-center justify-between pb-6 border-b border-[#C5A059]/30">
                    <span className="font-serif text-xl font-bold text-[#C5A059]">MAYURA DESIGNS</span>
                    <button onClick={() => setIsMobileMenuOpen(false)} className="text-gray-400 hover:text-white">✕</button>
                  </div>
                  <div className="mt-6 flex flex-col space-y-4 font-medium">
                    <button onClick={() => { setCurrentView('home'); setIsMobileMenuOpen(false); }} className="text-left py-2 hover:text-[#C5A059]">{store.t('navHome')}</button>
                    <button onClick={() => { setSelectedCategory('all'); setCurrentView('shop'); setIsMobileMenuOpen(false); }} className="text-left py-2 hover:text-[#C5A059]">{store.t('navShop')}</button>
                    <button onClick={() => { setCurrentView('collections'); setIsMobileMenuOpen(false); }} className="text-left py-2 hover:text-[#C5A059]">{store.t('navCollections')}</button>
                    <button onClick={() => { setSelectedCategory('all'); setActiveFilter('new'); setCurrentView('shop'); setIsMobileMenuOpen(false); }} className="text-left py-2 hover:text-[#C5A059]">{store.t('navNewArrivals')}</button>
                    <button onClick={() => { setSelectedCategory('all'); setActiveFilter('bestseller'); setCurrentView('shop'); setIsMobileMenuOpen(false); }} className="text-left py-2 hover:text-[#C5A059]">{store.t('navBestSellers')}</button>
                    <button onClick={() => { setCurrentView('about'); setIsMobileMenuOpen(false); }} className="text-left py-2 hover:text-[#C5A059]">{store.t('navAbout')}</button>
                    <button onClick={() => { setCurrentView('contact'); setIsMobileMenuOpen(false); }} className="text-left py-2 hover:text-[#C5A059]">{store.t('navContact')}</button>
                  </div>
                </div>
                <div className="pt-6 border-t border-[#C5A059]/30 text-xs text-gray-400">
                  <p>WhatsApp: +91 95674 77246</p>
                  <p>Instagram: @mayura.designss</p>
                </div>
              </div>
            </div>
          )}

          {/* SEARCH OVERLAY MODAL */}
          {isSearchOpen && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-md flex items-start justify-center pt-20 px-4">
              <div className="bg-[#FAF8F5] rounded-2xl max-w-2xl w-full p-6 shadow-2xl border border-[#C5A059]/30 relative animate-fade-in">
                <button onClick={() => setIsSearchOpen(false)} className="absolute top-4 right-4 text-gray-500 hover:text-black">✕</button>
                <h3 className="font-serif text-2xl text-[#0A1128] font-bold mb-4">Search Mayura Sarees</h3>
                <input 
                  type="text" 
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder={store.t('searchPlaceholder')}
                  autoFocus
                  className="w-full px-4 py-3 rounded-xl border-2 border-[#C5A059] bg-white text-lg focus:outline-none shadow-sm mb-4"
                />
                {searchQuery && (
                  <div className="max-h-80 overflow-y-auto space-y-3">
                    {filteredProducts.length === 0 ? (
                      <p className="text-gray-500 py-4 text-center">No sarees found matching "{searchQuery}".</p>
                    ) : (
                      filteredProducts.map(p => (
                        <div 
                          key={p.id} 
                          onClick={() => { handleOpenProduct(p.id); setIsSearchOpen(false); }}
                          className="flex items-center gap-4 p-2 hover:bg-[#F3EFEA] rounded-xl cursor-pointer transition"
                        >
                          <img src={p.images[0]} alt={p.name} className="w-16 h-20 object-cover rounded-lg" />
                          <div>
                            <div className="flex items-center gap-2">
                              <span className="text-[10px] font-bold text-[#C5A059] bg-[#0A1128] px-1.5 py-0.5 rounded">{p.code || 'MD001'}</span>
